[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "benchgrid"
dynamic = ["version"]
description = "Generic, workload-agnostic tooling keeping the compilation -> execution -> data -> analysis chain consistent for any project."
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "matplotlib",
    "psutil",
    "pandas",
    "polars",
    "streamlit",
    "altair",
]

[tool.hatch.version]
path = "benchgrid/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["benchgrid"]